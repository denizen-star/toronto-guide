<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="journeyGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F87171;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F3F4F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="trailGrad" cx="50%" cy="100%" r="80%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#journeyGrad2)" stroke="#991B1B" stroke-width="1"/>
  
  <!-- Rocket trail -->
  <ellipse cx="16" cy="22" rx="3" ry="8" fill="url(#trailGrad)" opacity="0.6"/>
  <ellipse cx="16" cy="24" rx="2" ry="6" fill="#FCD34D" opacity="0.5"/>
  <ellipse cx="16" cy="26" rx="1" ry="4" fill="#FBBF24" opacity="0.7"/>
  
  <!-- Rocket body (arrow shape) -->
  <path d="M 16 4 L 12 12 L 14 12 L 14 20 L 18 20 L 18 12 L 20 12 Z" fill="url(#rocketGrad)" stroke="#374151" stroke-width="0.5"/>
  
  <!-- Rocket nose cone -->
  <path d="M 16 4 L 14 8 L 18 8 Z" fill="#6B7280"/>
  
  <!-- Rocket fins -->
  <path d="M 12 12 L 10 14 L 12 16 Z" fill="#9CA3AF"/>
  <path d="M 20 12 L 22 14 L 20 16 Z" fill="#9CA3AF"/>
  
  <!-- Rocket windows/details -->
  <circle cx="16" cy="10" r="1" fill="#3B82F6" opacity="0.8"/>
  <rect x="15" y="13" width="2" height="3" rx="0.5" fill="#EF4444" opacity="0.8"/>
  <rect x="15" y="17" width="2" height="2" rx="0.5" fill="#10B981" opacity="0.8"/>
  
  <!-- Achievement stars around rocket -->
  <polygon points="8,8 8.5,9.5 10,9.5 8.8,10.5 9.3,12 8,11 6.7,12 7.2,10.5 6,9.5 7.5,9.5" fill="#FBBF24" opacity="0.9"/>
  <polygon points="24,10 24.5,11.5 26,11.5 24.8,12.5 25.3,14 24,13 22.7,14 23.2,12.5 22,11.5 23.5,11.5" fill="#FBBF24" opacity="0.9"/>
  <polygon points="26,6 26.3,7 27,7 26.5,7.5 26.7,8 26,7.7 25.3,8 25.5,7.5 25,7 25.7,7" fill="#FEF3C7" opacity="0.8"/>
  <polygon points="6,12 6.3,13 7,13 6.5,13.5 6.7,14 6,13.7 5.3,14 5.5,13.5 5,13 5.7,13" fill="#FEF3C7" opacity="0.8"/>
  
  <!-- Progress milestone dots along the trail -->
  <circle cx="16" cy="28" r="0.8" fill="#6B7280" opacity="0.6"/>
  <circle cx="16" cy="26" r="0.9" fill="#F59E0B" opacity="0.7"/>
  <circle cx="16" cy="24" r="1" fill="#10B981" opacity="0.8"/>
  <circle cx="16" cy="22" r="1.1" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="16" cy="20" r="1.2" fill="#EC4899" opacity="1"/>
  
  <!-- Speed lines -->
  <path d="M 8 18 L 12 18" stroke="#FCD34D" stroke-width="1" opacity="0.6"/>
  <path d="M 20 18 L 24 18" stroke="#FCD34D" stroke-width="1" opacity="0.6"/>
  <path d="M 9 21 L 12 21" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <path d="M 20 21 L 23 21" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  
  <!-- Sparkle effects -->
  <circle cx="10" cy="16" r="0.5" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="22" cy="16" r="0.5" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="12" cy="24" r="0.5" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="20" cy="24" r="0.5" fill="#FEF3C7" opacity="0.7"/>
</svg>
