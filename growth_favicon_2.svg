<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="growthGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#growthGrad2)" stroke="#1E3A8A" stroke-width="1"/>
  
  <!-- Main upward arrow -->
  <path d="M 16 6 L 12 12 L 14 12 L 14 24 L 18 24 L 18 12 L 20 12 Z" fill="url(#arrowGrad)" stroke="#1E40AF" stroke-width="0.5"/>
  
  <!-- Progress milestone dots along the arrow -->
  <circle cx="16" cy="22" r="1.5" fill="#EF4444" opacity="0.9"/>
  <circle cx="16" cy="19" r="1.5" fill="#F59E0B" opacity="0.9"/>
  <circle cx="16" cy="16" r="1.5" fill="#10B981" opacity="0.9"/>
  <circle cx="16" cy="13" r="1.5" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="16" cy="10" r="1.5" fill="#EC4899" opacity="0.9"/>
  
  <!-- Achievement levels on the sides -->
  <!-- Left side milestones -->
  <circle cx="10" cy="24" r="1" fill="#6B7280" opacity="0.6"/>
  <circle cx="9" cy="20" r="1.2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="8" cy="16" r="1.4" fill="#10B981" opacity="0.9"/>
  <circle cx="7" cy="12" r="1.6" fill="#8B5CF6" opacity="1"/>
  
  <!-- Right side milestones -->
  <circle cx="22" cy="24" r="1" fill="#6B7280" opacity="0.6"/>
  <circle cx="23" cy="20" r="1.2" fill="#F59E0B" opacity="0.8"/>
  <circle cx="24" cy="16" r="1.4" fill="#10B981" opacity="0.9"/>
  <circle cx="25" cy="12" r="1.6" fill="#8B5CF6" opacity="1"/>
  
  <!-- Connecting progress lines -->
  <path d="M 7 12 Q 12 8 16 10" stroke="#A855F7" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 25 12 Q 20 8 16 10" stroke="#A855F7" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Small sparkles around the arrow tip -->
  <circle cx="13" cy="8" r="0.8" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="19" cy="8" r="0.8" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="16" cy="5" r="1" fill="#FBBF24" opacity="0.9"/>
  
  <!-- Base foundation -->
  <rect x="12" y="25" width="8" height="2" rx="1" fill="#374151" opacity="0.7"/>
</svg>
