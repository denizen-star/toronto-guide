<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="towerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  
  <!-- CN Tower silhouette -->
  <!-- Main tower shaft -->
  <rect x="15" y="8" width="2" height="14" fill="url(#towerGradient)"/>
  
  <!-- Tower base -->
  <rect x="14" y="21" width="4" height="3" fill="url(#towerGradient)"/>
  
  <!-- Observation decks -->
  <ellipse cx="16" cy="16" rx="3" ry="1" fill="url(#towerGradient)"/>
  <ellipse cx="16" cy="18" rx="4" ry="1" fill="url(#towerGradient)"/>
  
  <!-- Sky Pod -->
  <ellipse cx="16" cy="12" rx="2" ry="0.8" fill="url(#towerGradient)"/>
  
  <!-- Antenna -->
  <rect x="15.5" y="5" width="1" height="4" fill="#60A5FA"/>
  
  <!-- Antenna tip -->
  <circle cx="16" cy="5" r="1" fill="#60A5FA"/>
</svg>