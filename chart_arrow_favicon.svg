<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#chartGrad)" stroke="#1E3A8A" stroke-width="1"/>
  
  <!-- Chart background -->
  <rect x="5" y="8" width="22" height="16" rx="1" fill="white" opacity="0.95"/>
  
  <!-- Chart grid lines -->
  <line x1="6" y1="12" x2="26" y2="12" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="6" y1="16" x2="26" y2="16" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="6" y1="20" x2="26" y2="20" stroke="#E5E7EB" stroke-width="0.5"/>
  
  <!-- Vertical grid lines -->
  <line x1="10" y1="8" x2="10" y2="24" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="14" y1="8" x2="14" y2="24" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="18" y1="8" x2="18" y2="24" stroke="#E5E7EB" stroke-width="0.5"/>
  <line x1="22" y1="8" x2="22" y2="24" stroke="#E5E7EB" stroke-width="0.5"/>
  
  <!-- Chart bars (showing growth) -->
  <rect x="7" y="21" width="2" height="2" fill="url(#barGrad)" opacity="0.7"/>
  <rect x="11" y="19" width="2" height="4" fill="url(#barGrad)" opacity="0.8"/>
  <rect x="15" y="16" width="2" height="7" fill="url(#barGrad)" opacity="0.9"/>
  <rect x="19" y="13" width="2" height="10" fill="url(#barGrad)" opacity="1"/>
  <rect x="23" y="10" width="2" height="13" fill="url(#barGrad)" opacity="1"/>
  
  <!-- Growth trend line -->
  <path d="M 8 22 L 12 20 L 16 17 L 20 14 L 24 11" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Data points on trend line -->
  <circle cx="8" cy="22" r="1" fill="#EF4444"/>
  <circle cx="12" cy="20" r="1" fill="#F59E0B"/>
  <circle cx="16" cy="17" r="1" fill="#10B981"/>
  <circle cx="20" cy="14" r="1" fill="#8B5CF6"/>
  <circle cx="24" cy="11" r="1" fill="#EC4899"/>
  
  <!-- Large upward arrow -->
  <path d="M 24 11 L 20 7 L 22 7 L 22 5 L 26 5 L 26 7 L 28 7 Z" fill="url(#arrowGrad)" stroke="#047857" stroke-width="0.5"/>
  
  <!-- Success indicators -->
  <polygon points="28,6 28.5,7 29.5,7 28.8,7.7 29.1,8.7 28,8.2 26.9,8.7 27.2,7.7 26.5,7 27.5,7" fill="#FBBF24" opacity="0.9"/>
  
  <!-- Chart axis labels (simplified) -->
  <line x1="6" y1="8" x2="6" y2="24" stroke="#374151" stroke-width="1"/>
  <line x1="6" y1="23" x2="26" y2="23" stroke="#374151" stroke-width="1"/>
  
  <!-- Small percentage indicator -->
  <text x="20" y="6" font-family="Arial, sans-serif" font-size="3" fill="#10B981" font-weight="bold">↗</text>
  
  <!-- Progress percentage -->
  <circle cx="26" cy="18" r="3" fill="#10B981" opacity="0.9"/>
  <text x="26" y="19" font-family="Arial, sans-serif" font-size="2.5" fill="white" text-anchor="middle" font-weight="bold">+</text>
</svg>
