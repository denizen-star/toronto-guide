<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="growthGrad5" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#growthGrad5)" stroke="#064E3B" stroke-width="1"/>
  
  <!-- Soil/ground base -->
  <ellipse cx="16" cy="26" rx="12" ry="3" fill="#92400E" opacity="0.8"/>
  
  <!-- Seedling stage (left side) -->
  <g opacity="0.6">
    <!-- Small stem -->
    <line x1="8" y1="25" x2="8" y2="20" stroke="#16A34A" stroke-width="1.5"/>
    <!-- Small leaves -->
    <ellipse cx="7" cy="20" rx="1.5" ry="1" fill="#22C55E" transform="rotate(-30 7 20)"/>
    <ellipse cx="9" cy="19" rx="1.5" ry="1" fill="#22C55E" transform="rotate(30 9 19)"/>
    <!-- Seed -->
    <circle cx="8" cy="25" r="1" fill="#A16207"/>
  </g>
  
  <!-- Growing stage (center-left) -->
  <g opacity="0.8">
    <!-- Medium stem -->
    <line x1="12" y1="25" x2="12" y2="15" stroke="#16A34A" stroke-width="2"/>
    <!-- Medium leaves -->
    <ellipse cx="10" cy="18" rx="2" ry="1.5" fill="#22C55E" transform="rotate(-45 10 18)"/>
    <ellipse cx="14" cy="16" rx="2" ry="1.5" fill="#22C55E" transform="rotate(45 14 16)"/>
    <ellipse cx="11" cy="14" rx="1.8" ry="1.3" fill="#16A34A" transform="rotate(-20 11 14)"/>
    <!-- Small root system -->
    <path d="M 12 25 Q 10 27 9 28" stroke="#A16207" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 12 25 Q 14 27 15 28" stroke="#A16207" stroke-width="1" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Mature tree stage (center-right) -->
  <g opacity="1">
    <!-- Strong trunk -->
    <rect x="15" y="16" width="3" height="9" rx="1" fill="#92400E"/>
    <!-- Tree crown -->
    <circle cx="16.5" cy="12" r="5" fill="#22C55E" opacity="0.9"/>
    <circle cx="14" cy="10" r="3" fill="#16A34A" opacity="0.8"/>
    <circle cx="19" cy="11" r="3.5" fill="#15803D" opacity="0.8"/>
    <!-- Fruits/achievements -->
    <circle cx="13" cy="9" r="0.8" fill="#EF4444"/>
    <circle cx="20" cy="12" r="0.8" fill="#F59E0B"/>
    <circle cx="16" cy="8" r="0.8" fill="#8B5CF6"/>
    <circle cx="18" cy="15" r="0.8" fill="#EC4899"/>
  </g>
  
  <!-- Flourishing stage (right side) -->
  <g opacity="0.9">
    <!-- Multiple branches -->
    <rect x="23" y="18" width="2.5" height="7" rx="1" fill="#92400E"/>
    <line x1="24" y1="20" x2="26" y2="18" stroke="#92400E" stroke-width="1.5"/>
    <line x1="24" y1="22" x2="22" y2="20" stroke="#92400E" stroke-width="1.5"/>
    <!-- Abundant foliage -->
    <circle cx="24" cy="15" r="4" fill="#22C55E" opacity="0.9"/>
    <circle cx="22" cy="13" r="2.5" fill="#16A34A" opacity="0.8"/>
    <circle cx="26" cy="14" r="3" fill="#15803D" opacity="0.8"/>
    <!-- Many fruits -->
    <circle cx="22" cy="12" r="0.7" fill="#EF4444"/>
    <circle cx="25" cy="13" r="0.7" fill="#F59E0B"/>
    <circle cx="24" cy="11" r="0.7" fill="#10B981"/>
    <circle cx="26" cy="16" r="0.7" fill="#8B5CF6"/>
    <circle cx="23" cy="17" r="0.7" fill="#EC4899"/>
  </g>
  
  <!-- Growth progression arrows -->
  <path d="M 10 22 Q 11 21 12 22" stroke="#FCD34D" stroke-width="1" fill="none" opacity="0.7" marker-end="url(#arrowhead)"/>
  <path d="M 14 18 Q 15 17 16 18" stroke="#FCD34D" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M 19 15 Q 20 14 21 15" stroke="#FCD34D" stroke-width="1" fill="none" opacity="0.7"/>
  
  <!-- Time progression indicators -->
  <text x="8" y="30" font-family="Arial, sans-serif" font-size="3" fill="#FBBF24" opacity="0.8">1</text>
  <text x="12" y="30" font-family="Arial, sans-serif" font-size="3" fill="#FBBF24" opacity="0.8">3</text>
  <text x="16" y="30" font-family="Arial, sans-serif" font-size="3" fill="#FBBF24" opacity="0.8">6</text>
  <text x="24" y="30" font-family="Arial, sans-serif" font-size="3" fill="#FBBF24" opacity="0.8">12</text>
  
  <!-- Success sparkles -->
  <polygon points="26,8 26.3,9 27,9 26.5,9.5 26.7,10 26,9.7 25.3,10 25.5,9.5 25,9 25.7,9" fill="#FEF3C7" opacity="0.9"/>
  <polygon points="13,6 13.2,6.5 13.7,6.5 13.4,6.8 13.6,7.3 13,7 12.4,7.3 12.6,6.8 12.3,6.5 12.8,6.5" fill="#FEF3C7" opacity="0.9"/>
</svg>
