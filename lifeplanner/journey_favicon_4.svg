<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="journeyGrad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#journeyGrad4)" stroke="#047857" stroke-width="1"/>
  
  <!-- Clean geometric arrow -->
  <path d="M 16 5 L 11 12 L 13.5 12 L 13.5 25 L 18.5 25 L 18.5 12 L 21 12 Z" 
        fill="url(#arrowGrad4)" stroke="#047857" stroke-width="0.5"/>
  
  <!-- Progress dots along the arrow shaft -->
  <circle cx="16" cy="24" r="1.5" fill="#DC2626" opacity="0.9"/>
  <circle cx="16" cy="21.5" r="1.4" fill="#EA580C" opacity="0.9"/>
  <circle cx="16" cy="19" r="1.3" fill="#F59E0B" opacity="0.9"/>
  <circle cx="16" cy="16.5" r="1.2" fill="#10B981" opacity="0.9"/>
  <circle cx="16" cy="14" r="1.1" fill="#06B6D4" opacity="0.9"/>
  <circle cx="16" cy="11.5" r="1" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="16" cy="9" r="0.9" fill="#EC4899" opacity="0.9"/>
  
  <!-- Side milestone markers -->
  <!-- Left side -->
  <circle cx="10" cy="23" r="0.8" fill="#6B7280" opacity="0.7"/>
  <circle cx="9" cy="20" r="1" fill="#F59E0B" opacity="0.8"/>
  <circle cx="8" cy="17" r="1.2" fill="#10B981" opacity="0.9"/>
  <circle cx="7" cy="14" r="1.4" fill="#8B5CF6" opacity="1"/>
  
  <!-- Right side -->
  <circle cx="22" cy="23" r="0.8" fill="#6B7280" opacity="0.7"/>
  <circle cx="23" cy="20" r="1" fill="#F59E0B" opacity="0.8"/>
  <circle cx="24" cy="17" r="1.2" fill="#10B981" opacity="0.9"/>
  <circle cx="25" cy="14" r="1.4" fill="#8B5CF6" opacity="1"/>
  
  <!-- Connecting lines between milestones -->
  <path d="M 7 14 L 16 11.5" stroke="#A855F7" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 25 14 L 16 11.5" stroke="#A855F7" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 8 17 L 16 14" stroke="#10B981" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 24 17 L 16 14" stroke="#10B981" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- Achievement rings around key milestones -->
  <circle cx="16" cy="16.5" r="2.5" stroke="#10B981" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="16" cy="11.5" r="2.8" stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Success indicator at arrow tip -->
  <circle cx="16" cy="5" r="1.5" fill="#FBBF24" opacity="0.9"/>
  <polygon points="16,4 16.5,5 17.5,5 16.8,5.7 17.1,6.7 16,6.2 14.9,6.7 15.2,5.7 14.5,5 15.5,5" 
           fill="#FEF3C7" opacity="0.9"/>
  
  <!-- Geometric accent lines -->
  <line x1="5" y1="16" x2="9" y2="16" stroke="#D1FAE5" stroke-width="1" opacity="0.6"/>
  <line x1="23" y1="16" x2="27" y2="16" stroke="#D1FAE5" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="5" x2="16" y2="2" stroke="#D1FAE5" stroke-width="1" opacity="0.6"/>
  
  <!-- Base foundation -->
  <rect x="12" y="26" width="8" height="2" rx="1" fill="#047857" opacity="0.7"/>
  
  <!-- Minimalist sparkles -->
  <circle cx="12" cy="8" r="0.5" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="20" cy="8" r="0.5" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="8" cy="12" r="0.4" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="24" cy="12" r="0.4" fill="#FEF3C7" opacity="0.7"/>
</svg>
