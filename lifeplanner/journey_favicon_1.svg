<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="journeyGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#journeyGrad1)" stroke="#581C87" stroke-width="1"/>
  
  <!-- Step platforms (achievement levels) -->
  <rect x="6" y="24" width="6" height="2" rx="1" fill="url(#stepGrad)" opacity="0.8"/>
  <rect x="9" y="21" width="6" height="2" rx="1" fill="url(#stepGrad)" opacity="0.85"/>
  <rect x="12" y="18" width="6" height="2" rx="1" fill="url(#stepGrad)" opacity="0.9"/>
  <rect x="15" y="15" width="6" height="2" rx="1" fill="url(#stepGrad)" opacity="0.95"/>
  <rect x="18" y="12" width="6" height="2" rx="1" fill="url(#stepGrad)" opacity="1"/>
  
  <!-- Main stepped arrow -->
  <path d="M 16 26 L 16 24 L 19 24 L 19 21 L 22 21 L 22 18 L 25 18 L 25 15 L 28 15 L 28 12 L 26 10 L 22 10 L 22 6 L 18 6 L 16 8 Z" 
        fill="white" opacity="0.9" stroke="#581C87" stroke-width="0.5"/>
  
  <!-- Achievement badges on each step -->
  <circle cx="9" cy="23" r="1.2" fill="#EF4444" opacity="0.9"/>
  <circle cx="12" cy="20" r="1.2" fill="#F59E0B" opacity="0.9"/>
  <circle cx="15" cy="17" r="1.2" fill="#10B981" opacity="0.9"/>
  <circle cx="18" cy="14" r="1.2" fill="#06B6D4" opacity="0.9"/>
  <circle cx="21" cy="11" r="1.2" fill="#EC4899" opacity="0.9"/>
  
  <!-- Progress connections -->
  <path d="M 9 23 L 12 20" stroke="#FCD34D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 12 20 L 15 17" stroke="#FCD34D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 15 17 L 18 14" stroke="#FCD34D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 18 14 L 21 11" stroke="#FCD34D" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Success crown at the top -->
  <path d="M 20 8 L 21 6 L 22 8 L 23 6 L 24 8 L 22 9 Z" fill="#FBBF24" opacity="0.9"/>
  
  <!-- Small achievement stars -->
  <polygon points="11,25 11.3,26 12,26 11.5,26.5 11.7,27 11,26.7 10.3,27 10.5,26.5 10,26 10.7,26" fill="#FEF3C7" opacity="0.8"/>
  <polygon points="25,13 25.3,14 26,14 25.5,14.5 25.7,15 25,14.7 24.3,15 24.5,14.5 24,14 24.7,14" fill="#FEF3C7" opacity="0.8"/>
  
  <!-- Foundation -->
  <rect x="4" y="26" width="10" height="1" rx="0.5" fill="#4C1D95" opacity="0.7"/>
</svg>
