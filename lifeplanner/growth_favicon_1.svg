<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="growthGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ringGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#growthGrad1)" stroke="#064E3B" stroke-width="1"/>
  
  <!-- Progress rings (growth levels) -->
  <circle cx="16" cy="16" r="12" stroke="url(#ringGrad1)" stroke-width="1" fill="none" opacity="0.4"/>
  <circle cx="16" cy="16" r="9" stroke="url(#ringGrad1)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="16" cy="16" r="6" stroke="url(#ringGrad1)" stroke-width="2" fill="none" opacity="0.8"/>
  
  <!-- Central tree trunk -->
  <rect x="14.5" y="18" width="3" height="8" rx="1" fill="#92400E"/>
  
  <!-- Tree crown - layered growth -->
  <circle cx="16" cy="14" r="6" fill="#22C55E" opacity="0.9"/>
  <circle cx="14" cy="12" r="4" fill="#16A34A" opacity="0.8"/>
  <circle cx="18" cy="13" r="3.5" fill="#15803D" opacity="0.8"/>
  
  <!-- Growth milestone markers -->
  <circle cx="22" cy="10" r="1.2" fill="#FCD34D"/>
  <circle cx="10" cy="12" r="1.2" fill="#F59E0B"/>
  <circle cx="16" cy="8" r="1.2" fill="#EF4444"/>
  <circle cx="20" cy="20" r="1.2" fill="#8B5CF6"/>
  <circle cx="12" cy="22" r="1.2" fill="#EC4899"/>
  
  <!-- Small achievement stars -->
  <polygon points="16,4 16.5,5.5 18,5.5 16.8,6.5 17.3,8 16,7 14.7,8 15.2,6.5 14,5.5 15.5,5.5" fill="#FEF3C7" opacity="0.9"/>
  
  <!-- Root system indicators -->
  <path d="M 14 26 Q 12 28 10 29" stroke="#A16207" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 18 26 Q 20 28 22 29" stroke="#A16207" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
