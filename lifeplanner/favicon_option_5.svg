<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad5)" stroke="#3730A3" stroke-width="1"/>
  
  <!-- Central balance point -->
  <circle cx="16" cy="16" r="2" fill="white"/>
  
  <!-- Balance arms/paths -->
  <!-- Top path - Personal Growth -->
  <path d="M 16 16 Q 12 8 8 6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="8" cy="6" r="2.5" fill="#10B981"/>
  
  <!-- Top right path - Relationships -->
  <path d="M 16 16 Q 24 8 26 6" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="26" cy="6" r="2.5" fill="#EC4899"/>
  
  <!-- Right path - Career -->
  <path d="M 16 16 Q 24 16 28 16" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="28" cy="16" r="2.5" fill="#F59E0B"/>
  
  <!-- Bottom right path - Health -->
  <path d="M 16 16 Q 24 24 26 26" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="2.5" fill="#EF4444"/>
  
  <!-- Bottom path - Leisure -->
  <path d="M 16 16 Q 12 24 8 26" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="8" cy="26" r="2.5" fill="#8B5CF6"/>
  
  <!-- Left path - Planning -->
  <path d="M 16 16 Q 8 16 4 16" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="4" cy="16" r="2.5" fill="#06B6D4"/>
  
  <!-- Inner connecting ring -->
  <circle cx="16" cy="16" r="6" stroke="white" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Small activity indicators -->
  <circle cx="13" cy="10" r="1" fill="#22C55E" opacity="0.8"/>
  <circle cx="19" cy="10" r="1" fill="#F97316" opacity="0.8"/>
  <circle cx="22" cy="16" r="1" fill="#3B82F6" opacity="0.8"/>
  <circle cx="19" cy="22" r="1" fill="#84CC16" opacity="0.8"/>
  <circle cx="13" cy="22" r="1" fill="#F472B6" opacity="0.8"/>
  <circle cx="10" cy="16" r="1" fill="#A855F7" opacity="0.8"/>
</svg>
