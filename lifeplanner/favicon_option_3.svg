<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad3)" stroke="#064E3B" stroke-width="1"/>
  
  <!-- Clock face -->
  <circle cx="16" cy="16" r="11" fill="white" opacity="0.95" stroke="#6B7280" stroke-width="0.5"/>
  
  <!-- Clock numbers -->
  <circle cx="16" cy="7" r="0.8" fill="#374151"/>
  <circle cx="25" cy="16" r="0.8" fill="#374151"/>
  <circle cx="16" cy="25" r="0.8" fill="#374151"/>
  <circle cx="7" cy="16" r="0.8" fill="#374151"/>
  
  <!-- Clock hands -->
  <!-- Hour hand pointing to 2 -->
  <line x1="16" y1="16" x2="20" y2="11" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 -->
  <line x1="16" y1="16" x2="16" y2="8" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#064E3B"/>
  
  <!-- Progress arc -->
  <path d="M 16 5 A 11 11 0 0 1 27 16" stroke="#10B981" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Small productivity indicators -->
  <circle cx="22" cy="10" r="1" fill="#F59E0B" opacity="0.8"/>
  <circle cx="22" cy="22" r="1" fill="#EF4444" opacity="0.8"/>
  <circle cx="10" cy="22" r="1" fill="#8B5CF6" opacity="0.8"/>
</svg>
