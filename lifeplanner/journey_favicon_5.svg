<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="journeyGrad5" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEF3C7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#journeyGrad5)" stroke="#D97706" stroke-width="1"/>
  
  <!-- Main upward arrow -->
  <path d="M 16 6 L 12 13 L 14 13 L 14 24 L 18 24 L 18 13 L 20 13 Z" 
        fill="url(#arrowGrad5)" stroke="#D97706" stroke-width="0.5"/>
  
  <!-- Achievement badges with ribbons -->
  <!-- Badge 1 - Starting level -->
  <circle cx="16" cy="22" r="2" fill="#DC2626" opacity="0.9"/>
  <text x="16" y="23" font-family="Arial, sans-serif" font-size="2" fill="white" text-anchor="middle" font-weight="bold">1</text>
  <path d="M 14 24 L 14 26 L 16 25 L 18 26 L 18 24" fill="url(#ribbonGrad)" opacity="0.8"/>
  
  <!-- Badge 2 - Growth level -->
  <circle cx="16" cy="19" r="2" fill="#EA580C" opacity="0.9"/>
  <text x="16" y="20" font-family="Arial, sans-serif" font-size="2" fill="white" text-anchor="middle" font-weight="bold">2</text>
  <path d="M 14 21 L 14 23 L 16 22 L 18 23 L 18 21" fill="#F97316" opacity="0.8"/>
  
  <!-- Badge 3 - Progress level -->
  <circle cx="16" cy="16" r="2" fill="#F59E0B" opacity="0.9"/>
  <text x="16" y="17" font-family="Arial, sans-serif" font-size="2" fill="white" text-anchor="middle" font-weight="bold">3</text>
  <path d="M 14 18 L 14 20 L 16 19 L 18 20 L 18 18" fill="#FBBF24" opacity="0.8"/>
  
  <!-- Badge 4 - Achievement level -->
  <circle cx="16" cy="13" r="2" fill="#10B981" opacity="0.9"/>
  <polygon points="16,12 16.5,13 17.5,13 16.8,13.7 17.1,14.7 16,14.2 14.9,14.7 15.2,13.7 14.5,13 15.5,13" 
           fill="#FEF3C7" opacity="0.9"/>
  <path d="M 14 15 L 14 17 L 16 16 L 18 17 L 18 15" fill="#34D399" opacity="0.8"/>
  
  <!-- Badge 5 - Mastery level -->
  <circle cx="16" cy="10" r="2" fill="#8B5CF6" opacity="0.9"/>
  <polygon points="16,9 16.5,10 17.5,10 16.8,10.7 17.1,11.7 16,11.2 14.9,11.7 15.2,10.7 14.5,10 15.5,10" 
           fill="#FEF3C7" opacity="0.9"/>
  <path d="M 14 12 L 14 14 L 16 13 L 18 14 L 18 12" fill="#A855F7" opacity="0.8"/>
  
  <!-- Side milestone markers -->
  <!-- Left side achievements -->
  <circle cx="9" cy="21" r="1.2" fill="#6B7280" opacity="0.7"/>
  <circle cx="8" cy="18" r="1.3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="7" cy="15" r="1.4" fill="#10B981" opacity="0.9"/>
  <circle cx="6" cy="12" r="1.5" fill="#8B5CF6" opacity="1"/>
  
  <!-- Right side achievements -->
  <circle cx="23" cy="21" r="1.2" fill="#6B7280" opacity="0.7"/>
  <circle cx="24" cy="18" r="1.3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="25" cy="15" r="1.4" fill="#10B981" opacity="0.9"/>
  <circle cx="26" cy="12" r="1.5" fill="#8B5CF6" opacity="1"/>
  
  <!-- Achievement connection lines -->
  <path d="M 6 12 L 16 10" stroke="#A855F7" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 26 12 L 16 10" stroke="#A855F7" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- Crown at the top -->
  <path d="M 14 7 L 15 5 L 16 6 L 17 5 L 18 7 L 16 8 Z" fill="#FBBF24" opacity="0.9"/>
  <circle cx="16" cy="6" r="0.5" fill="#EF4444"/>
  
  <!-- Victory sparkles -->
  <polygon points="12,8 12.3,9 13,9 12.5,9.5 12.7,10 12,9.7 11.3,10 11.5,9.5 11,9 11.7,9" fill="#FEF3C7" opacity="0.9"/>
  <polygon points="20,8 20.3,9 21,9 20.5,9.5 20.7,10 20,9.7 19.3,10 19.5,9.5 19,9 19.7,9" fill="#FEF3C7" opacity="0.9"/>
  <polygon points="8,10 8.2,10.5 8.7,10.5 8.4,10.8 8.6,11.3 8,11 7.4,11.3 7.6,10.8 7.3,10.5 7.8,10.5" fill="#FEF3C7" opacity="0.8"/>
  <polygon points="24,10 24.2,10.5 24.7,10.5 24.4,10.8 24.6,11.3 24,11 23.4,11.3 23.6,10.8 23.3,10.5 23.8,10.5" fill="#FEF3C7" opacity="0.8"/>
  
  <!-- Base platform -->
  <rect x="12" y="25" width="8" height="2" rx="1" fill="#D97706" opacity="0.7"/>
  
  <!-- Celebration confetti -->
  <circle cx="10" cy="14" r="0.3" fill="#EC4899" opacity="0.8"/>
  <circle cx="22" cy="14" r="0.3" fill="#06B6D4" opacity="0.8"/>
  <circle cx="11" cy="17" r="0.3" fill="#10B981" opacity="0.8"/>
  <circle cx="21" cy="17" r="0.3" fill="#EF4444" opacity="0.8"/>
</svg>
