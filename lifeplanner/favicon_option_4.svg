<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad4)" stroke="#0C4A6E" stroke-width="1"/>
  
  <!-- Tree trunk -->
  <rect x="14" y="20" width="4" height="6" rx="1" fill="#92400E"/>
  
  <!-- Tree crown - main circle -->
  <circle cx="16" cy="16" r="8" fill="#10B981" opacity="0.9"/>
  
  <!-- Tree crown - layers for depth -->
  <circle cx="14" cy="14" r="5" fill="#059669" opacity="0.8"/>
  <circle cx="18" cy="15" r="4.5" fill="#047857" opacity="0.8"/>
  <circle cx="16" cy="18" r="4" fill="#065F46" opacity="0.7"/>
  
  <!-- Growth nodes/fruits representing goals -->
  <circle cx="12" cy="12" r="1.5" fill="#F59E0B"/>
  <circle cx="20" cy="13" r="1.5" fill="#EF4444"/>
  <circle cx="16" cy="10" r="1.5" fill="#8B5CF6"/>
  <circle cx="14" cy="19" r="1.5" fill="#EC4899"/>
  <circle cx="19" cy="18" r="1.5" fill="#F97316"/>
  
  <!-- Small leaves/branches -->
  <ellipse cx="11" cy="15" rx="1.5" ry="0.8" fill="#22C55E" opacity="0.7" transform="rotate(45 11 15)"/>
  <ellipse cx="21" cy="16" rx="1.5" ry="0.8" fill="#22C55E" opacity="0.7" transform="rotate(-30 21 16)"/>
  <ellipse cx="16" cy="22" rx="1.5" ry="0.8" fill="#22C55E" opacity="0.7" transform="rotate(15 16 22)"/>
  
  <!-- Subtle root system -->
  <path d="M 14 26 Q 12 28 10 29" stroke="#92400E" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 18 26 Q 20 28 22 29" stroke="#92400E" stroke-width="1" fill="none" opacity="0.6"/>
</svg>
