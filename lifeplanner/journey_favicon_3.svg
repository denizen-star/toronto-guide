<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="meditationGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C7D2FE;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.2" />
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#meditationGrad)" stroke="#4338CA" stroke-width="1"/>
  
  <!-- Meditation aura/energy field -->
  <circle cx="16" cy="18" r="10" fill="url(#auraGrad)" opacity="0.6"/>
  <circle cx="16" cy="18" r="7" fill="url(#auraGrad)" opacity="0.4"/>
  <circle cx="16" cy="18" r="4" fill="url(#auraGrad)" opacity="0.3"/>
  
  <!-- Meditation sitting silhouette -->
  <!-- Head -->
  <circle cx="16" cy="12" r="2.5" fill="#1E1B4B" opacity="0.9"/>
  
  <!-- Body/torso -->
  <ellipse cx="16" cy="17" rx="2" ry="3" fill="#1E1B4B" opacity="0.9"/>
  
  <!-- Legs in lotus position -->
  <ellipse cx="13" cy="21" rx="2" ry="1.5" fill="#1E1B4B" opacity="0.9" transform="rotate(-15 13 21)"/>
  <ellipse cx="19" cy="21" rx="2" ry="1.5" fill="#1E1B4B" opacity="0.9" transform="rotate(15 19 21)"/>
  
  <!-- Arms/hands in meditation pose -->
  <ellipse cx="13.5" cy="18" rx="1" ry="2" fill="#1E1B4B" opacity="0.9" transform="rotate(-30 13.5 18)"/>
  <ellipse cx="18.5" cy="18" rx="1" ry="2" fill="#1E1B4B" opacity="0.9" transform="rotate(30 18.5 18)"/>
  
  <!-- Upward growth arrow emerging from crown chakra -->
  <path d="M 16 9 L 13 5 L 14.5 5 L 14.5 3 L 17.5 3 L 17.5 5 L 19 5 Z" fill="url(#arrowGrad)" opacity="0.9"/>
  
  <!-- Energy/consciousness levels rising -->
  <circle cx="16" cy="7" r="0.8" fill="#FBBF24" opacity="0.9"/>
  <circle cx="16" cy="5" r="0.6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="16" cy="3" r="0.4" fill="#EF4444" opacity="0.7"/>
  
  <!-- Chakra points along the body -->
  <circle cx="16" cy="12" r="0.5" fill="#8B5CF6" opacity="0.8"/> <!-- Crown -->
  <circle cx="16" cy="13.5" r="0.5" fill="#6366F1" opacity="0.8"/> <!-- Third eye -->
  <circle cx="16" cy="15" r="0.5" fill="#06B6D4" opacity="0.8"/> <!-- Throat -->
  <circle cx="16" cy="17" r="0.5" fill="#10B981" opacity="0.8"/> <!-- Heart -->
  <circle cx="16" cy="19" r="0.5" fill="#F59E0B" opacity="0.8"/> <!-- Solar plexus -->
  <circle cx="16" cy="21" r="0.5" fill="#EF4444" opacity="0.8"/> <!-- Root -->
  
  <!-- Meditation breath waves -->
  <path d="M 8 16 Q 12 14 16 16 Q 20 18 24 16" stroke="#C7D2FE" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M 9 18 Q 12 16 16 18 Q 20 20 23 18" stroke="#C7D2FE" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M 10 20 Q 13 18 16 20 Q 19 22 22 20" stroke="#C7D2FE" stroke-width="1" fill="none" opacity="0.4"/>
  
  <!-- Enlightenment sparkles -->
  <polygon points="11,6 11.3,7 12,7 11.5,7.5 11.7,8 11,7.7 10.3,8 10.5,7.5 10,7 10.7,7" fill="#FEF3C7" opacity="0.9"/>
  <polygon points="21,6 21.3,7 22,7 21.5,7.5 21.7,8 21,7.7 20.3,8 20.5,7.5 20,7 20.7,7" fill="#FEF3C7" opacity="0.9"/>
  <polygon points="16,1 16.2,1.5 16.8,1.5 16.4,1.8 16.6,2.3 16,2 15.4,2.3 15.6,1.8 15.2,1.5 15.8,1.5" fill="#FEF3C7" opacity="0.9"/>
  
  <!-- Ground/foundation -->
  <ellipse cx="16" cy="24" rx="8" ry="1" fill="#1E1B4B" opacity="0.3"/>
  
  <!-- Floating lotus petals -->
  <ellipse cx="10" cy="14" rx="1" ry="0.5" fill="#EC4899" opacity="0.7" transform="rotate(45 10 14)"/>
  <ellipse cx="22" cy="14" rx="1" ry="0.5" fill="#EC4899" opacity="0.7" transform="rotate(-45 22 14)"/>
  <ellipse cx="8" cy="20" rx="0.8" ry="0.4" fill="#F472B6" opacity="0.6" transform="rotate(30 8 20)"/>
  <ellipse cx="24" cy="20" rx="0.8" ry="0.4" fill="#F472B6" opacity="0.6" transform="rotate(-30 24 20)"/>
</svg>
