<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="growthGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#growthGrad4)" stroke="#92400E" stroke-width="1"/>
  
  <!-- Central glow -->
  <circle cx="16" cy="16" r="8" fill="url(#centerGlow)" opacity="0.6"/>
  
  <!-- Spiral growth path -->
  <path d="M 16 16 Q 20 16 22 12 Q 22 8 18 6 Q 12 4 8 8 Q 4 14 8 20 Q 16 26 26 22 Q 32 16 28 10" 
        stroke="#FBBF24" stroke-width="2.5" fill="none" opacity="0.8"/>
  
  <!-- Inner spiral -->
  <path d="M 16 16 Q 18 16 19 14 Q 19 12 17 11 Q 14 10 12 12 Q 10 15 12 18 Q 16 21 20 19" 
        stroke="#FEF3C7" stroke-width="1.5" fill="none" opacity="0.9"/>
  
  <!-- Goal achievement nodes along the spiral -->
  <!-- Starting point -->
  <circle cx="16" cy="16" r="1.5" fill="#DC2626" opacity="0.9"/>
  
  <!-- First level goals -->
  <circle cx="19" cy="14" r="1.3" fill="#EF4444" opacity="0.9"/>
  <circle cx="17" cy="11" r="1.3" fill="#F59E0B" opacity="0.9"/>
  
  <!-- Second level goals -->
  <circle cx="12" cy="12" r="1.3" fill="#10B981" opacity="0.9"/>
  <circle cx="12" cy="18" r="1.3" fill="#06B6D4" opacity="0.9"/>
  
  <!-- Third level goals -->
  <circle cx="20" cy="19" r="1.3" fill="#8B5CF6" opacity="0.9"/>
  <circle cx="26" cy="22" r="1.3" fill="#EC4899" opacity="0.9"/>
  
  <!-- Outer achievement markers -->
  <circle cx="22" cy="12" r="1.1" fill="#FBBF24" opacity="0.8"/>
  <circle cx="18" cy="6" r="1.1" fill="#F97316" opacity="0.8"/>
  <circle cx="8" cy="8" r="1.1" fill="#84CC16" opacity="0.8"/>
  <circle cx="8" cy="20" r="1.1" fill="#06B6D4" opacity="0.8"/>
  
  <!-- Progress indicators -->
  <path d="M 16 16 L 19 14" stroke="#DC2626" stroke-width="1" opacity="0.6"/>
  <path d="M 19 14 L 17 11" stroke="#EF4444" stroke-width="1" opacity="0.6"/>
  <path d="M 17 11 L 12 12" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>
  <path d="M 12 12 L 12 18" stroke="#10B981" stroke-width="1" opacity="0.6"/>
  <path d="M 12 18 L 20 19" stroke="#06B6D4" stroke-width="1" opacity="0.6"/>
  
  <!-- Achievement sparkles -->
  <polygon points="26,22 26.5,23 27.5,23 26.8,23.7 27.1,24.7 26,24.2 24.9,24.7 25.2,23.7 24.5,23 25.5,23" 
           fill="#FEF3C7" opacity="0.9"/>
  <polygon points="18,6 18.3,6.7 19,6.7 18.5,7.2 18.7,7.9 18,7.6 17.3,7.9 17.5,7.2 17,6.7 17.7,6.7" 
           fill="#FEF3C7" opacity="0.9"/>
  <polygon points="8,8 8.2,8.5 8.7,8.5 8.4,8.8 8.6,9.3 8,9 7.4,9.3 7.6,8.8 7.3,8.5 7.8,8.5" 
           fill="#FEF3C7" opacity="0.9"/>
  
  <!-- Energy flow lines -->
  <path d="M 4 16 Q 8 12 16 16" stroke="#FCD34D" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 28 16 Q 24 20 16 16" stroke="#FCD34D" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
